name: Build Auzify

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      API_BASE: ${{ vars.API_BASE }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      # Melengkapi file platform yang tidak ikut di zip (gradlew, wrapper jar, ikon & style default).
      # File yang sudah ada TIDAK ditimpa.
      - name: Lengkapi scaffolding Android
        run: flutter create --platforms=android --org id.austin --project-name auzify .

      - name: Turunkan domain App Links dari API_BASE
        run: echo "APP_LINK_HOST=$(echo "${API_BASE:-https://auzify.example.com}" | sed -E 's#^https?://##; s#/.*$##')" >> "$GITHUB_ENV"

      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - name: APK debug
        run: flutter build apk --debug --dart-define=API_BASE=${API_BASE:-https://auzify.example.com}

      - uses: actions/upload-artifact@v4
        with:
          name: auzify-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Siapkan keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS

      - name: AAB release
        if: env.KEYSTORE_BASE64 != ''
        run: flutter build appbundle --release --build-number=${{ github.run_number }} --dart-define=API_BASE=${API_BASE:-https://auzify.example.com}

      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: auzify-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # Pemetaan R8 supaya laporan crash di Play Console bisa dibaca.
      - uses: actions/upload-artifact@v4
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: auzify-r8-mapping
          path: build/app/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
